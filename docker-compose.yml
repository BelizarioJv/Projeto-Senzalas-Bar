services:
  database:
    image: postgres:16-alpine
    container_name: senzalas_postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: senzalas_backend
    restart: always

    env_file:
      - ./backend/.env

    ports:
      - "8080:8080"

    depends_on:
      - database

volumes:
  postgres_data:
