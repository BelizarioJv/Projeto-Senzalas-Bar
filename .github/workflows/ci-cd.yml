name: CI/CD - Front-end (Vercel) & Backend (Render)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ==========================================
  # 1. TESTES E DEPLOY DO FRONT-END (VERCEL)
  # ==========================================
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end # Apontando para sua pasta front-end

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./front-end/package-lock.json"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar Testes do Front-end
        run: npm test

      - name: Testar Deploy / Preview na Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./front-end
          # Gera Preview em Pull Request e Deploy de Produção no Push na branch main
          vercel-args: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }}

  # ==========================================
  # 2. TESTES E DEPLOY DO BACKEND (RENDER)
  # ==========================================
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # Apontando para sua pasta backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de Tipos e Linter (TypeScript)
        run: npm run lint --if-present

      - name: Rodar Testes do Backend
        run: npm test

      - name: Validar Build do Backend
        run: npm run build

      - name: Acionar Deploy na Render
        # Executa tanto em Pull Request quanto em Push para testar o gatilho de deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
